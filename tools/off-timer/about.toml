# cargo-about settings: which licenses we accept in shipped dependencies.
# Generation fails if a dependency uses a license not listed here
# (e.g. GPL) -- decide before adding it.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Bitstream-Vera",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = ["x86_64-pc-windows-msvc"]
